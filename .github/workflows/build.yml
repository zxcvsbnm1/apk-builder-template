name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # Download template android yang sudah 100% working
          rm -rf app build.gradle settings.gradle gradlew gradle
          git clone --depth=1 https://github.com/OnikurYhmat/minimal-android-project.git temp
          cp -r temp/*.
          cp -r temp/.gradle. 2>/dev/null || true
          rm -rf temp.git
          git init
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p app/src/main/assets
          echo "<h1>DATA HK V10.9 OK - BUILD FIX 9</h1>" > app/src/main/assets/index.html
          # Ganti MainActivity jadi WebView
          cat > app/src/main/java/com/example/minimal/MainActivity.kt << 'K'
          package com.example.minimal
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.webkit.WebView
          import android.webkit.WebViewClient
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val w = WebView(this)
              w.settings.javaScriptEnabled = true
              w.webViewClient = WebViewClient()
              w.loadUrl("file:///android_asset/index.html")
              setContentView(w)
            }
          }
          K
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
